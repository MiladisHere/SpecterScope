plugins {
    id 'com.android.application'
}

android {
    namespace 'app.specterscope'
    compileSdk 34

    defaultConfig {
        applicationId 'app.specterscope'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // No private keystore needed: sign with the standard debug key so the APK installs directly.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// The app uses only the Android platform APIs: no AndroidX or third-party libraries.
